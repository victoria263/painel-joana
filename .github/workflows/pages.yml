name: Publica painel no GitHub Pages

# A cada push, copia o index.html para o branch gh-pages,
# que é a fonte do site https://victoria263.github.io/painel-joana/

on:
  push:
    branches: [claude/panel-setup-repo-2hnu0d, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publica index.html no branch gh-pages
        run: |
          mkdir -p /tmp/site && cp index.html /tmp/site/
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza painel (deploy automático)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
