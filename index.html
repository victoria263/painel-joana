  .lgpd{font-size:11.5px;opacity:.9;margin-top:8px;display:flex;align-items:center;gap:6px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.9}

  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.18s;display:flex;gap:14px;align-items:center}

  .pcard .sub{font-size:12px;color:var(--mut);margin-top:3px}

  .b-ativa{background:#e4f6ee;color:#1f7d5c}
  .b-inativa{background:#eceeed;color:#8b938f}

  .back{display:inline-flex;align-items:center;gap:7px;margin:22px 0 6px;color:var(--green);font-weight:600;cursor:pointer}
  .detail{display:grid;grid-template-columns:minmax(320px,1fr) minmax(300px,420px);gap:22px;padding-bottom:60px;align-items:start}
  @media(max-width:820px){.detail{grid-template-columns:1fr}}

  .phone{background:#0b141a;border-radius:22px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  .wa{background:#efeae2;border-radius:14px;overflow:hidden;height:640px;display:flex;flex-direction:column}

  .wa-hd .nm{font-weight:600;font-size:15px}
  .wa-hd .st{font-size:11.5px;opacity:.85}

  .wa-empty{color:#8a948f;text-align:center;margin-top:40px;font-size:13px}

  .meds{margin:6px 0 0;padding-left:18px}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:16px;margin-left:6px}
  .p-ok{background:#e4f6ee;color:#1f7d5c}
  .p-wait{background:#fbf1d8;color:#a9781a}
  .p-late{background:#fbe4de;color:#c0432b}
  .p-tbd{background:#eceeed;color:#8b938f}
  .meta{background:linear-gradient(120deg,#fffaf0,#fff);border:1.5px solid #eedcae}
  .meta .big{font-size:22px;font-weight:800;color:var(--gold);margin-top:4px}
  .tbd{color:#a58a4d;font-style:italic}

  /* login */
  .gate{position:fixed;inset:0;background:linear-gradient(120deg,#2f8f6f,#3aa77f);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
  .gbox{background:#fff;border-radius:18px;padding:34px 30px;max-width:340px;width:100%;text-align:center}
  .gbox h2{font-size:20px}
  .gbox p{color:var(--mut);font-size:13px;margin:8px 0 18px}

  .gbox button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .gbox .err{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px}
  .foot{color:var(--mut);font-size:11.5px;text-align:center;padding:20px 0 40px}

        {

          "texto": "Eu já agendei todos os exames para uma data única porém só consegui para o dia 11/08",
          "ts": "2026-07-13T14:15:03.610907+00:00",
          "hora": "13/07 14:15"
        }
      ],
      "marcos": {
        "termoLGPD": {
          "aceito": "a confirmar",
          "data": null
        },
        "diagnostico": "TRH há 3 anos",
        "tratamento": "Reposição hormonal (TRH)",
        "medicamentos": [
          "Lenzzeto (2 sprays de estradiol de manhã, cada spray numa parte do antebraço)",
          "Progesterona (1 comprimido à noite)",
          "Testosterona gel (de manhã)"
        ],
        "ultimaConsulta": "a confirmar",
        "proximaConsulta": "Retorno quando os exames ficarem prontos",

        "metaRetorno": {

let STATE={patients:[],sel:null,loaded:false,demo:false};

function avatarInitials(nome){return (nome||"?").split(" ").filter(Boolean).slice(0,2).map(s=>s[0]).join("").toUpperCase();}
function colorFor(nome){let h=0;for(const c of (nome||"")) h=(h*31+c.charCodeAt(0))%PALETTE.length;return PALETTE[h];}
function avatarEl(p,cls){
  if(p.foto) return `<img class="av ${cls||''}" src="${p.foto}" alt="">`;
  return `<div class="av ${cls||''}" style="background:${colorFor(p.nome)}">${avatarInitials(p.nome)}</div>`;
}
function fmtDateShort(iso){ if(!iso) return "—"; try{const d=new Date(iso);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch(e){return iso;} }
function isDate(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}/.test(s); }
function diasFaltando(s){ if(!isDate(s)) return null; const d=new Date(s); const now=new Date(); return Math.ceil((d-now)/(1000*60*60*24)); }

function statusPill(v){
  if(v===true||v==='alcancada') return `<span class="pill p-ok">alcançada</span>`;
  if(v==='vencida') return `<span class="pill p-late">vencida</span>`;
  if(v==='em_andamento') return `<span class="pill p-wait">em andamento</span>`;
  if(v===false) return `<span class="pill p-tbd">pendente</span>`;
  return `<span class="pill p-tbd">a confirmar</span>`;
}
function termoPill(v){ if(v===true) return `<span class="pill p-ok">aceito</span>`; if(v===false) return `<span class="pill p-tbd">pendente</span>`; return `<span class="pill p-tbd">a confirmar</span>`; }
function val(v){ if(v===null||v===undefined||v==="") return `<span class="tbd">a confirmar</span>`; if(typeof v==='string' && v.toLowerCase().includes('a confirmar')) return `<span class="tbd">${v}</span>`; return v; }

async function fetchData(){
  try{
    const r=await fetch(API_BASE+'/api/patients',{cache:'no-store'});
    if(!r.ok) throw 0;
    const d=await r.json();
    STATE.patients=d.pacientes||[]; STATE.loaded=true; STATE.demo=false; render();
  }catch(e){
    // fallback: dados de exemplo embutidos (modo demo, pra iterar o visual sem backend)
    STATE.patients=(SAMPLE_DATA&&SAMPLE_DATA.pacientes)||[]; STATE.loaded=true; STATE.demo=true; render();
  }
}

function render(){
  const app=document.getElementById('app');
  const view=document.getElementById('view');
  const ativas=STATE.patients.filter(p=>p.ativa).length;
  document.getElementById('count').textContent=`${ativas} ativas / ${STATE.patients.length} total`;
  var _ll=document.getElementById('livelbl'); if(_ll) _ll.textContent=STATE.demo?'modo demo (dados de exemplo)':'ao vivo';
  if(STATE.sel){ const p=STATE.patients.find(x=>x.telefone===STATE.sel); if(p){view.innerHTML=detailHTML(p);scrollWA();return;} }
  const q=(document.getElementById('search').value||"").toLowerCase();
  const list=STATE.patients.filter(p=>(p.nome||"").toLowerCase().includes(q));
  view.innerHTML=`<div class="grid">${list.map(cardHTML).join("")||'<p style="color:#7c8a86;padding:20px">Nenhuma paciente.</p>'}</div>`;
}

function cardHTML(p){
  return `<div class="pcard" onclick="open_('${p.telefone}')">
    ${avatarEl(p)}
    <div>
      <div class="nm">${p.nome}</div>
      <div class="sub">última: ${fmtDateShort(p.ultimaInteracao)}</div>
      <span class="badge ${p.ativa?'b-ativa':'b-inativa'}">${p.ativa?'ativa':'inativa'}</span>
    </div>
  </div>`;
}

function detailHTML(p){
  const m=p.marcos||{};
  const msgs=(p.mensagens||[]).map(x=>`
    <div class="msg ${x.de==='joana'?'m-joana':'m-pac'}">${escapeHtml(x.texto)}<span class="m-time">${x.hora||''}</span></div>`).join("")
    || '<div class="wa-empty">Sem conversa ainda. A paciente não respondeu.</div>';
  const cycles=(p.ciclos||[]).map(c=>`<span class="cyc ${c.atual?'cur':(c.meta&&c.meta.status==='alcancada'?'done':'')}">Ciclo ${c.numero}${c.meta&&c.meta.status==='alcancada'?' ✓':''}${c.atual?' (atual)':''}</span>`).join("");
  const metaDias=m.metaRetorno?diasFaltando(m.metaRetorno.data):null;
  const metaLinha = m.metaRetorno ? (
     isDate(m.metaRetorno.data)
       ? `<div class="big">${new Date(m.metaRetorno.data).toLocaleDateString('pt-BR')}</div><div style="font-size:13px;color:#7c8a86">${metaDias>=0?`faltam ${metaDias} dias`:`vencida há ${-metaDias} dias`}</div>`
       : `<div style="margin-top:4px">${val(m.metaRetorno.data)}</div>`
   ) : '<span class="tbd">a confirmar</span>';

  return `<div class="back" onclick="open_(null)">‹ voltar</div>
  <div class="detail">
    <div class="phone"><div class="wa">
      <div class="wa-hd">${avatarEl(p)}<div><div class="nm">${p.nome}</div><div class="st">${p.ativa?'conversa ativa':'sem resposta ainda'}</div></div></div>
      <div class="wa-body" id="wabody">${msgs}</div>
    </div></div>

    <div class="panel">
      <div class="pnhead">${avatarEl(p)}<div>
        <div class="nm">${p.nome}</div>
        <div style="margin-top:8px" class="cycles">${cycles||''}</div>
      </div></div>

      <div class="mcard meta">
        <div class="lb">🎯 Meta · consulta de retorno (30 dias) ${m.metaRetorno?statusPill(m.metaRetorno.status):''}</div>
        ${metaLinha}
      </div>

      <div class="mcard"><div class="lb">📄 Termo LGPD ${m.termoLGPD?termoPill(m.termoLGPD.aceito):''}</div><div class="vl">${m.termoLGPD&&m.termoLGPD.data?('aceito em '+new Date(m.termoLGPD.data).toLocaleDateString('pt-BR')):val(m.termoLGPD?m.termoLGPD.aceito===true?'aceito':'a confirmar':null)}</div></div>
      <div class="mcard"><div class="lb">🩺 Diagnóstico</div><div class="vl">${val(m.diagnostico)}</div></div>
      <div class="mcard"><div class="lb">💊 Tratamento</div><div class="vl">${val(m.tratamento)}</div></div>
      <div class="mcard"><div class="lb">💠 Medicamentos</div>${(m.medicamentos&&m.medicamentos.length)?`<ul class="meds">${m.medicamentos.map(x=>`<li>${x}</li>`).join("")}</ul>`:`<div class="vl">${val(null)}</div>`}</div>
      <div class="mcard"><div class="lb">📅 Última consulta</div><div class="vl">${val(m.ultimaConsulta)}</div></div>
      <div class="mcard"><div class="lb">📆 Próxima consulta</div><div class="vl">${val(m.proximaConsulta)}</div></div>
      <div class="mcard"><div class="lb">🔁 Check-ins</div><div class="vl">${val(m.checkins)}</div></div>
    </div>
  </div>`;
}

function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function open_(tel){STATE.sel=tel;render();window.scrollTo(0,0);}
function scrollWA(){const b=document.getElementById('wabody');if(b)b.scrollTop=b.scrollHeight;}

// login simples
function tryLogin(){
  const v=document.getElementById('pw').value.trim();
  if(v==='donna' || v==='adere'){ sessionStorage.setItem('painel_ok','1'); showApp(); }
  else document.getElementById('gerr').textContent='Senha incorreta.';
}
function showApp(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';fetchData();setInterval(fetchData,15000);}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
if(sessionStorage.getItem('painel_ok')==='1'){showApp();}
</script>
